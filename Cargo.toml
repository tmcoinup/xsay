[package]
name = "xsay"
version = "0.1.26"
edition = "2024"
description = "Chinese-first offline AI voice input tool with SenseVoice/Paraformer"
license = "MIT"
readme = "README.md"

[[bin]]
name = "xsay"
path = "src/main.rs"

[build-dependencies]
# Windows-only at runtime (see build.rs); declared unconditionally so
# `cargo check` on any host can still resolve the graph.
winres = "0.1"

[package.metadata.deb]
maintainer = "mason"
copyright = "2026, mason"
extended-description = """\
xsay captures microphone audio with a configurable hotkey, transcribes it \
offline with SenseVoice/Paraformer via sherpa-onnx, and types the result \
into the focused window. Optimized for Chinese dictation on Linux."""
section = "utils"
priority = "optional"
# Runtime packages only. Tools and headers such as cmake, pkg-config and
# `*-dev` packages are build-time requirements for source builds; end users
# installing the .deb should only need these shared-library/runtime packages.
# `apt install ./xsay_*.deb` will resolve them automatically. For fully
# offline installs, run `packaging/deb/vendor-runtime-libs.sh` before
# `cargo deb --no-build`; the launcher below then loads bundled copies from
# /usr/lib/xsay.
depends = "libc6, libasound2, libx11-6, libxi6, libxtst6, libxdo3"
maintainer-scripts = "packaging/deb/maintainer-scripts"
assets = [
    # Install the real binary next to vendored runtime libs. The launcher below
    # sets LD_LIBRARY_PATH so `dpkg -i` installs do not need apt to resolve the
    # desktop/audio/X11/Sherpa shared-library packages first.
    ["target/release/xsay", "usr/lib/xsay/xsay", "755"],
    ["target/debian-vendor-libs/*", "usr/lib/xsay/", "644"],
    ["packaging/deb/xsay", "usr/bin/xsay", "755"],
    ["README.md", "usr/share/doc/xsay/README", "644"],
    # Desktop launcher (Ubuntu Software / Activities picks it up).
    ["share/applications/xsay.desktop", "usr/share/applications/xsay.desktop", "644"],
    # App icons in standard hicolor theme paths so GNOME / KDE / etc.
    # resolve them automatically.
    ["share/icons/hicolor/48x48/apps/xsay.png",     "usr/share/icons/hicolor/48x48/apps/xsay.png",     "644"],
    ["share/icons/hicolor/256x256/apps/xsay.png",   "usr/share/icons/hicolor/256x256/apps/xsay.png",   "644"],
    ["share/icons/hicolor/scalable/apps/xsay.svg",  "usr/share/icons/hicolor/scalable/apps/xsay.svg",  "644"],
    # Allow the input group to write /dev/uinput so Wayland auto-paste can use
    # xsay's virtual keyboard without manual rule creation.
    ["packaging/deb/60-xsay-uinput.rules", "lib/udev/rules.d/60-xsay-uinput.rules", "644"],
]

[dependencies]
cpal = "0.15"
whisper-rs = "0.14"
# Force the OpenGL (glow) backend instead of eframe 0.34's new wgpu default.
# wgpu's Vulkan path on GNOME mutter does not advertise an alpha-supporting
# CompositeAlphaMode for our transparent always-on-top overlay surface — the
# floating mic indicator ends up rendered with an opaque clear color which
# blocks whatever is behind it. glow uses GLX/EGL where the X11 32-bit
# visual handles per-pixel alpha cleanly.
eframe = { version = "0.34.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.34.1"
enigo = "0.2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hf-hub = "0.3"
dirs = "5.0.1"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
ureq = { version = "2", features = ["native-tls"] }
libc = "0.2"

# rdev is the global keyboard listener on macOS and Windows. On Linux its
# implementation routes through X11's XRecord extension, which deadlocks
# GNOME mutter when xsay also has its own X11 windows in the same process —
# Linux uses evdev (below) instead and `rdev` is not compiled in at all.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

# Optional GPU acceleration. Default build = CPU only, works on any machine
# without system dependencies beyond what's already required. Enthusiasts
# and GPU-owning users can opt in via `--features <name>`:
#
#   cuda     NVIDIA + CUDA toolkit installed        (cargo build --release --features cuda)
#   vulkan   cross-vendor, NVIDIA/AMD/Intel         (cargo build --release --features vulkan)
#   metal    macOS Apple Silicon / Intel with Metal (cargo build --release --features metal)
#   hipblas  AMD + ROCm toolkit                     (cargo build --release --features hipblas)
#   coreml   macOS CoreML neural engine             (cargo build --release --features coreml)
#
# Whisper-backend flags above are mutually exclusive (whisper-rs-sys
# links one GGML backend). `build.sh` wraps common permutations.
#
# SenseVoice / ONNX alternative backend — best Chinese accuracy, 5-7x
# faster than Whisper-large, via the sherpa-rs wrapper over sherpa-onnx:
#
#   sensevoice        CPU ONNX (pre-built libs fetched on `cargo build`)
#   sensevoice-cuda   same but with CUDA execution provider
#
# Feature-gated so default build stays whisper-only and avoids pulling
# the ~50MB sherpa-onnx shared library when unused.
[features]
# sensevoice is in the default set because SenseVoice is the fast /
# high-accuracy Chinese path most users end up wanting — making it
# opt-in meant `cargo run` silently fell back to Whisper every new
# clone, and people had to learn the `--features sensevoice` incantation.
# Users who want the absolute-minimum whisper-only build can still
# `cargo build --no-default-features [--features vulkan]`.
default = ["sensevoice"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]
hipblas = ["whisper-rs/hipblas"]
coreml = ["whisper-rs/coreml"]
sensevoice = ["dep:sherpa-rs"]
sensevoice-cuda = ["dep:sherpa-rs", "sherpa-rs/cuda"]

[dependencies.sherpa-rs]
version = "0.6"
optional = true
default-features = false
features = ["download-binaries"]
